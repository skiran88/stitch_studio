
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Venture Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#111111;
    --panel:#1a1a1a;
    --card:#222222;
    --accent:#8b6f4e;
    --text:#f5f2ee;
    --muted:#9d9d9d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:"Cormorant Garamond", serif;
}

.admin-container{
    display:flex;
    min-height:100vh;
}

/* Sidebar */

.sidebar{
    width:260px;
    background:var(--panel);
    padding:2rem;
    border-right:1px solid rgba(255,255,255,.08);
}

.sidebar h1{
    color:var(--accent);
    margin-bottom:3rem;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    padding:1rem 0;
    color:var(--muted);
    cursor:pointer;
    transition:.3s;
}

.sidebar li:hover{
    color:var(--accent);
}

/* Main */

.main{
    flex:1;
    padding:3rem;
}

.dashboard-title{
    font-size:3rem;
    margin-bottom:2rem;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:1.5rem;
    margin-bottom:2rem;
}

.card{
    background:var(--card);
    padding:2rem;
    border-radius:15px;
}

.card h3{
    color:var(--accent);
    margin-bottom:.5rem;
}

.card p{
    font-size:2rem;
}

.section{
    background:var(--card);
    padding:2rem;
    border-radius:15px;
    margin-bottom:2rem;
}

.section h2{
    margin-bottom:1rem;
}

input,
textarea{
    width:100%;
    background:#2d2d2d;
    color:white;
    border:none;
    padding:1rem;
    border-radius:10px;
    margin:.5rem 0;
}

textarea{
    min-height:120px;
}

button{
    background:var(--accent);
    border:none;
    color:white;
    padding:1rem 2rem;
    border-radius:10px;
    cursor:pointer;
    margin-top:1rem;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:1.5rem;
}

.product-card{
    background:#2d2d2d;
    border-radius:15px;
    overflow:hidden;
}

.product-card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product-content{
    padding:1rem;
}

.actions{
    display:flex;
    gap:1rem;
    margin-top:1rem;
}

.delete-btn{
    background:#b33b3b;
}

@media(max-width:900px){

.admin-container{
    flex-direction:column;
}

.sidebar{
    width:100%;
}

}
</style>
</head>

<body>

<div class="admin-container">

    <main class="main">

        <h1 class="dashboard-title">
            Admin Dashboard
        </h1>

        <div class="stats">

            <div class="card">
                <h3>Total Products</h3>
                <p>12</p>
            </div>

            <div class="card">
                <h3>Orders</h3>
                <p>28</p>
            </div>

            <div class="card">
                <h3>Visitors</h3>
                <p>1.2K</p>
            </div>

        </div>

        <!-- HERO -->

        <section class="section">

            <h2>Hero Section</h2>

            <input type="text"
            placeholder="Hero Title">

            <textarea
            placeholder="Hero Description"></textarea>

            <button>Save Hero</button>

        </section>

        <!-- ADD PRODUCT -->

        <section class="section">

            <h2>Add Product</h2>

            <input type="text"
            placeholder="Product Name">

            <input type="number"
            placeholder="Price">

            <textarea
            placeholder="Description"></textarea>

            <input type="file">

            <button>Add Product</button>

        </section>

        <!-- PRODUCT LIST -->

        <section class="section">

            <h2>Products</h2>

            <div class="products">

                <div class="product-card">

                    <img src="https://via.placeholder.com/400x300">

                    <div class="product-content">

                        <h3>Summer Dress</h3>
                        <p>₹1999</p>

                        <div class="actions">
                            <button>Edit</button>
                            <button class="delete-btn">
                                Delete
                            </button>
                        </div>

                    </div>

                </div>

                <div class="product-card">

                    <img src="https://via.placeholder.com/400x300">

                    <div class="product-content">

                        <h3>Designer Kurti</h3>
                        <p>₹2499</p>

                        <div class="actions">
                            <button>Edit</button>
                            <button class="delete-btn">
                                Delete
                            </button>
                        </div>

                    </div>

                </div>

            </div>

        </section>

        <!-- ABOUT -->

        <section class="section">

            <h2>About Us</h2>

            <textarea placeholder="About Us Content"></textarea>

            <button>Save About Us</button>

        </section>

        <!-- PRINCIPLES -->

        <section class="section">

            <h2>Our Principles</h2>

            <input value="Slow is Smooth">

            <input value="Form Follows Feeling">

            <input value="Details are the Design">

            <button>Save Principles</button>

        </section>

    </main>

</div>

</body>
</html>

<!-- CONTENT -->

<div class="main-content">

    <section id="dashboard" class="page-section">
        <h2>Dashboard</h2>
        <p>Welcome to Street Venture Admin.</p>
    </section>

    <section id="products" class="page-section" style="display:none;">
        <h2>Products</h2>
        <button>Add Product</button>
    </section>

    <section id="hero" class="page-section" style="display:none;">
        <h2>Hero Section</h2>
    </section>

    <section id="about" class="page-section" style="display:none;">
        <h2>About Us</h2>
    </section>

    <section id="principles" class="page-section" style="display:none;">
        <h2>Our Principles</h2>
    </section>

</div>

<script>

function showSection(sectionId){

    const sections =
    document.querySelectorAll('.page-section');

    sections.forEach(section => {
        section.style.display = 'none';
    });

    document.getElementById(sectionId)
            .style.display = 'block';
}

</script>
